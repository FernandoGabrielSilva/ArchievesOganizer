app-id: com.fernandogabriel.OrganizadorArquivos
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: organizador-arquivos
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
modules:
  - name: organizador-arquivos
    buildsystem: simple
    build-commands:
      - install -Dm755 OrganizadorArquivos /app/bin/organizador-arquivos
      - install -Dm644 organizador.desktop /app/share/applications/com.fernandogabriel.OrganizadorArquivos.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/com.fernandogabriel.OrganizadorArquivos.png
    sources:
      - type: file
        path: OrganizadorArquivos
      - type: file
        path: organizador.desktop
      - type: file
        path: icon.png
