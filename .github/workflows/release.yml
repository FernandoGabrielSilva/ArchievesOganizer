name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            appimage_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            appimage_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 binutils file wget libfuse2 libfuse2t64 2>/dev/null || sudo apt-get install -y --no-install-recommends libfuse2
          sudo apt-get install -y --no-install-recommends rpm dpkg-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build onefile binary
        run: |
          pyinstaller --noconfirm --windowed --onefile --name OrganizadorArquivos main.py \
            --hidden-import organizer --collect-all qfluentwidgets --collect-all PySide6

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/OrganizadorArquivos AppDir/usr/bin/OrganizadorArquivos
          cp resources/organizador.desktop AppDir/usr/share/applications/organizador-arquivos.desktop
          cp resources/organizador.desktop AppDir/organizador-arquivos.desktop
          cp resources/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/organizador-arquivos.png
          cp resources/icon.png AppDir/organizador-arquivos.png
          cp resources/icon.png AppDir/OrganizadorArquivos.png
          cp resources/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/OrganizadorArquivos
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          ARCH=${{ matrix.appimage_arch }} /tmp/appimagetool AppDir "OrganizadorArquivos-${{ matrix.appimage_arch }}.AppImage" || true
          ls -lh *.AppImage || true

      - name: Build tarball
        run: |
          mkdir -p tarball/organizador-arquivos
          cp dist/OrganizadorArquivos tarball/organizador-arquivos/
          cp -r organizer resources main.py requirements.txt tarball/organizador-arquivos/ 2>/dev/null || true
          cd tarball && tar -czf "../OrganizadorArquivos-${{ matrix.arch }}.tar.gz" organizador-arquivos

      - name: Build deb
        run: |
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh "${GITHUB_REF_NAME#v}" "${{ matrix.arch }}"

      - name: Build rpm
        if: matrix.arch == 'x86_64'
        run: |
          chmod +x packaging/build-rpm.sh
          ./packaging/build-rpm.sh "${GITHUB_REF_NAME#v}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: organizador-${{ matrix.arch }}
          path: |
            dist/OrganizadorArquivos
            *.AppImage
            *.tar.gz
            *.deb
            *.rpm

  flatpak:
    name: Flatpak (x86_64)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: organizador-x86_64
          path: flatpak-src
      - name: Build flatpak
        timeout-minutes: 25
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08
          mkdir -p flatpak-build
          find flatpak-src -name 'OrganizadorArquivos' -exec cp {} flatpak-build/ \;
          cp packaging/flatpak/com.fernandogabriel.OrganizadorArquivos.yml flatpak-build/
          cp resources/organizador.desktop flatpak-build/organizador.desktop
          cp resources/icon.png flatpak-build/icon.png
          cd flatpak-build
          flatpak-builder --force-clean build-dir com.fernandogabriel.OrganizadorArquivos.yml
          flatpak build-export export build-dir
          flatpak build-bundle export OrganizadorArquivos-x86_64.flatpak com.fernandogabriel.OrganizadorArquivos
          ls -lh *.flatpak

      - name: Upload flatpak
        uses: actions/upload-artifact@v4
        with:
          name: organizador-flatpak
          path: flatpak-build/*.flatpak

  arch:
    name: Arch package (x86_64)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: organizador-x86_64
          path: arch-src
      - name: Build arch package
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm zstd
          mkdir -p /tmp/archbuild
          find arch-src -name 'OrganizadorArquivos' -exec cp {} /tmp/archbuild/ \;
          cp packaging/build-arch.sh /tmp/archbuild/
          cp resources/organizador.desktop /tmp/archbuild/organizador.desktop
          cp resources/icon.png /tmp/archbuild/icon.png
          cd /tmp/archbuild
          chmod +x build-arch.sh
          ./build-arch.sh "${GITHUB_REF_NAME#v}"
          ls -lh *.pkg.tar.zst

      - name: Upload arch
        uses: actions/upload-artifact@v4
        with:
          name: organizador-arch
          path: /tmp/archbuild/*.pkg.tar.zst

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, arch, flatpak]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List
        run: find artifacts -type f
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.AppImage
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.pkg.tar.zst
            artifacts/*.flatpak
          generate_release_notes: true
          body: |
            ## Organizador de Arquivos — ${{ github.ref_name }}

            Organize arquivos por tipo em pastas com interface Fluent Design.

            ### Downloads
            - **OrganizadorArquivos-x86_64.AppImage** — AppImage auto-contido (x86_64)
            - **OrganizadorArquivos-aarch64.AppImage** — AppImage auto-contido (ARM64)
            - **OrganizadorArquivos_x86_64.deb / _arm64.deb** — pacotes Debian/Ubuntu
            - **organizador-arquivos-*.rpm** — pacote Fedora/RHEL
            - **OrganizadorArquivos-*.tar.gz** — tarball portátil
            - **.flatpak / *.pkg.tar.zst** — Flatpak e Arch (quando disponíveis)

            ### Novidades
            - Verificação e instalação automática de atualizações (configurável).
            - 28 idiomas, tema dark/light, preview e histórico com desfazer.
            - Builds multi-arquitetura automatizados via GitHub Actions.
